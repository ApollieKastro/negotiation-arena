<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арена переговоров</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .page { padding: 40px 0 60px; }
        .welcome { text-align: center; margin-bottom: 48px; }
        .welcome h1 { font-size: 1.8em; font-weight: 800; margin-bottom: 8px; }
        .welcome p { color: var(--text-secondary); font-size: 1.05em; }
        .section-title {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .scenarios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }
        .scenario-card {
            display: flex;
            flex-direction: column;
        }
        .scenario-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .scenario-title { font-size: 1.05em; font-weight: 600; }
        .scenario-desc {
            color: var(--text-secondary);
            font-size: 0.88em;
            line-height: 1.5;
            margin-bottom: 16px;
            flex: 1;
        }
        .scenario-meta {
            display: flex;
            gap: 12px;
            font-size: 0.8em;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .scenario-partner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .partner-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-light);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            flex-shrink: 0;
        }
        .partner-name { font-weight: 600; font-size: 0.9em; }
        .partner-role { color: var(--text-muted); font-size: 0.8em; }
        .start-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9em;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: all var(--transition);
        }
        .start-btn:hover { background: var(--accent-hover); }

        /* History */
        .history-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 48px; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
        }
        .history-score { font-size: 1.2em; font-weight: 700; }

        /* AI Generator */
        .ai-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .ai-form .full-width { grid-column: 1 / -1; }
        .generate-btn {
            grid-column: 1 / -1;
        }

        /* Preview */
        .preview {
            margin-top: 20px;
            padding: 20px;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            display: none;
        }
        .preview.show { display: block; }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .preview-title { font-weight: 600; }
        .preview-actions { display: flex; gap: 8px; }
        .preview-field { margin-bottom: 12px; }
        .preview-field-label { font-size: 0.8em; color: var(--text-muted); margin-bottom: 2px; }
        .preview-field-value { font-size: 0.9em; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9em;
        }
        .mode-btn.active {
            border-color: var(--accent) !important;
            background: var(--accent-light) !important;
            color: var(--accent) !important;
        }
        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8em;
            font-family: var(--font);
            transition: all var(--transition);
        }
        .logout-btn:hover { border-color: var(--red); color: var(--red); }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <div class="logo">
                <div class="logo-icon">🎯</div>
                Арена переговоров
            </div>
            <div class="nav">
                <a href="/dashboard" class="nav-link">Сценарии</a>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span id="userLogin" style="font-size:0.85em;color:var(--text-secondary)"></span>
                    <span class="badge" id="userRole" style="background:var(--accent-light);color:var(--accent)"></span>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            </div>
        </div>
    </header>

    <main class="container page">
        <div class="welcome">
            <h1>Выберите сценарий</h1>
            <p>Тренируйте навыки переговоров с ИИ-оппонентом</p>
        </div>

        <div class="section-title">Доступные сценарии</div>
        <div style="display:flex;gap:8px;margin-bottom:20px;align-items:center;">
            <span style="font-size:0.85em;color:var(--text-muted);">Режим:</span>
            <button class="mode-btn active" data-mode="text" onclick="setMode('text')" style="padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-family:var(--font);font-size:0.85em;color:var(--text-secondary);transition:all var(--transition);">⌨️ Текст</button>
            <button class="mode-btn" data-mode="voice" onclick="setMode('voice')" style="padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-family:var(--font);font-size:0.85em;color:var(--text-secondary);transition:all var(--transition);">🎙️ Голос</button>
        </div>
        <div class="scenarios-grid" id="scenariosGrid"></div>

        <div class="section-title">История тренировок</div>
        <div class="history-list" id="historyList">
            <div class="empty-state">Пока нет тренировок. Начните первую!</div>
        </div>

        <div class="section-title">Генератор сценариев</div>
        <div class="card">
            <div style="margin-bottom:20px;">
                <div style="font-weight:600;margin-bottom:4px;">Создайте свой сценарий</div>
                <div style="color:var(--text-secondary);font-size:0.88em;">Опишите тему — ИИ создаст уникальный сценарий переговоров</div>
            </div>
            <form class="ai-form" id="aiForm" onsubmit="return generateScenario(event)">
                <div class="form-group">
                    <label class="form-label">Тема переговоров *</label>
                    <input type="text" class="form-input" id="aiTopic" placeholder="Повышение зарплаты, аренда офиса..." required>
                </div>
                <div class="form-group">
                    <label class="form-label">Сложность</label>
                    <select class="form-select" id="aiDifficulty">
                        <option value="Начальная">Начальная</option>
                        <option value="Средняя" selected>Средняя</option>
                        <option value="Высокая">Высокая</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Сфера</label>
                    <select class="form-select" id="aiSphere">
                        <option>Продажи</option>
                        <option>HR</option>
                        <option>Закупки</option>
                        <option>IT</option>
                        <option>Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Стиль оппонента</label>
                    <select class="form-select" id="aiStyle">
                        <option value="professional">Профессиональный</option>
                        <option value="aggressive">Агрессивный</option>
                        <option value="passive">Пассивный</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label class="form-label">Дополнительные детали</label>
                    <textarea class="form-input" id="aiDetails" rows="3" placeholder="Опишите контекст..." style="resize:vertical"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-lg generate-btn" id="generateBtn">
                    <span>✨</span> Сгенерировать
                </button>
            </form>

            <div class="preview" id="preview">
                <div class="preview-header">
                    <div class="preview-title">Сценарий готов</div>
                    <div class="preview-actions">
                        <button class="btn btn-ghost btn-sm" onclick="regenerate()">🔄 Заново</button>
                        <button class="btn btn-primary btn-sm" onclick="startGenerated()">▶ Начать</button>
                    </div>
                </div>
                <div id="previewContent"></div>
            </div>
        </div>
    </main>

    <script>
        // Auth
        function getCookie(n) { const m=document.cookie.split(';').find(c=>c.trim().startsWith(n+'=')); return m?m.trim().split('=')[1]:null; }
        const token = getCookie('token');
        if (!token) window.location.href = '/auth';
        document.getElementById('userLogin').textContent = getCookie('userId') || '';
        document.getElementById('userRole').textContent = getCookie('role') || 'user';

        function logout() {
            ['token','role','userId'].forEach(c => document.cookie = c+'=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/');
            window.location.href = '/auth';
        }

        // Theme
        function setTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('theme', t); }
        function toggleTheme() { setTheme(localStorage.getItem('theme') === 'dark' ? 'light' : 'dark'); }
        setTheme(localStorage.getItem('theme') || 'dark');

        // Mode selector (text/voice)
        let selectedMode = localStorage.getItem('negotiationMode') || 'text';
        function setMode(m) {
            selectedMode = m;
            localStorage.setItem('negotiationMode', m);
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
        }

        // Scenarios
        async function loadScenarios() {
            try {
                const r = await fetch('/api/scenarios');
                const scenarios = await r.json();
                renderScenarios(scenarios);
            } catch(e) { console.error(e); }
        }

        function renderScenarios(list) {
            const grid = document.getElementById('scenariosGrid');
            if (!list.length) { grid.innerHTML = '<div class="empty-state">Нет доступных сценариев</div>'; return; }
            grid.innerHTML = list.map(s => {
                const dc = s.difficulty === 'Начальная' ? 'easy' : s.difficulty === 'Средняя' ? 'medium' : 'hard';
                return `
                <div class="card scenario-card animate-in">
                    <div class="scenario-header">
                        <div class="scenario-title">${s.title}</div>
                        <span class="badge badge-${dc}">${s.difficulty}</span>
                    </div>
                    <div class="scenario-desc">${s.description}</div>
                    <div class="scenario-meta">
                        <span>🎯 ${s.sphere}</span>
                    </div>
                    <div class="scenario-partner">
                        <div class="partner-avatar-sm">👤</div>
                        <div>
                            <div class="partner-name">${s.partner_name}</div>
                            <div class="partner-role">${s.partner_role}</div>
                        </div>
                    </div>
                    <button class="start-btn" onclick="startScenario('${s.id}')">Начать переговоры</button>
                </div>`;
            }).join('');
        }

        async function startScenario(id) {
            try {
                const r = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ scenario_id: id, difficulty: 'Средняя', mode: selectedMode })
                });
                const d = await r.json();
                if (d.session_id) window.location.href = `/dialogue/${d.session_id}`;
            } catch(e) { alert('Ошибка запуска'); }
        }

        // History
        async function loadHistory() {
            try {
                const r = await fetch('/api/history');
                const h = await r.json();
                renderHistory(h);
            } catch(e) {}
        }

        function renderHistory(list) {
            const el = document.getElementById('historyList');
            if (!list || !list.length) return;
            el.innerHTML = list.map(h => {
                const d = new Date(h.created_at).toLocaleDateString('ru-RU', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
                const c = h.score >= 70 ? 'var(--green)' : h.score >= 40 ? 'var(--orange)' : 'var(--red)';
                return `<div class="card card-sm history-item"><div><div style="font-weight:600;font-size:0.9em;">${h.ending||'Тренировка'}</div><div style="font-size:0.8em;color:var(--text-muted)">${d}</div></div><div class="history-score" style="color:${c}">${h.score}</div></div>`;
            }).join('');
        }

        // AI Generator
        let generatedScenario = null;

        async function generateScenario(e) {
            e.preventDefault();
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Генерирую...';
            try {
                const r = await fetch('/api/generate-scenario', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        topic: document.getElementById('aiTopic').value,
                        difficulty: document.getElementById('aiDifficulty').value,
                        sphere: document.getElementById('aiSphere').value,
                        opponent_style: document.getElementById('aiStyle').value,
                        details: document.getElementById('aiDetails').value
                    })
                });
                const d = await r.json();
                if (d.success && d.scenario) {
                    generatedScenario = d.scenario;
                    showPreview(d.scenario);
                } else {
                    alert('Ошибка: ' + (d.message || 'Неизвестная ошибка'));
                }
            } catch(e) { alert('Ошибка сети'); }
            btn.disabled = false;
            btn.innerHTML = '<span>✨</span> Сгенерировать';
            return false;
        }

        function showPreview(s) {
            document.getElementById('previewContent').innerHTML = `
                <div class="preview-field"><div class="preview-field-label">Название</div><div class="preview-field-value">${s.title}</div></div>
                <div class="preview-field"><div class="preview-field-label">Описание</div><div class="preview-field-value">${s.description}</div></div>
                <div class="preview-field"><div class="preview-field-label">Оппонент</div><div class="preview-field-value">${s.partner_name} — ${s.partner_role}</div></div>
                <div class="preview-field"><div class="preview-field-label">BATNA</div><div class="preview-field-value">${s.player_batna}</div></div>
            `;
            document.getElementById('preview').classList.add('show');
        }

        function regenerate() {
            document.getElementById('preview').classList.remove('show');
            generatedScenario = null;
            generateScenario(new Event('submit'));
        }

        async function startGenerated() {
            if (!generatedScenario) return;
            try {
                const r = await fetch('/api/start-generated', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ scenario: generatedScenario, difficulty: 'Средняя', mode: selectedMode })
                });
                const d = await r.json();
                if (d.session_id) window.location.href = `/dialogue/${d.session_id}`;
            } catch(e) { alert('Ошибка запуска'); }
        }

        loadScenarios();
        loadHistory();
        // Init mode buttons
        setMode(selectedMode);
    </script>
</body>
</html>
