<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арена переговоров</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4em;
            margin: 0 auto 16px;
        }
        .auth-title {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.9em;
        }
        .auth-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85em;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            border-radius: 6px;
            transition: all var(--transition);
        }
        .auth-tab.active {
            background: var(--bg-card);
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85em;
            margin-bottom: 16px;
            display: none;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .theme-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            transition: all var(--transition);
        }
        .theme-btn.active { border-color: var(--accent); }
        .theme-btn:hover { border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🎯</div>
                <h1 class="auth-title">Арена переговоров</h1>
                <p class="auth-subtitle">Тренажёр навыков делового общения</p>
            </div>

            <div class="card">
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="showTab('login')">Вход</button>
                    <button class="auth-tab" onclick="showTab('register')">Регистрация</button>
                </div>

                <div id="errorBox" class="auth-error"></div>

                <form id="loginForm" class="auth-form active" onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-input" id="loginLogin" placeholder="Введите логин" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="Введите пароль" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Войти</button>
                </form>

                <form id="registerForm" class="auth-form" onsubmit="return handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-input" id="regLogin" placeholder="Минимум 3 символа" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="Минимум 6 символов" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Создать аккаунт</button>
                </form>
            </div>

            <div class="auth-footer">
                <div style="color: var(--text-muted); font-size: 0.8em;">Тема оформления</div>
                <div class="theme-row">
                    <button class="theme-btn" data-theme-val="light" onclick="setTheme('light')" title="Светлая">☀️</button>
                    <button class="theme-btn active" data-theme-val="dark" onclick="setTheme('dark')" title="Тёмная">🌙</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme
        function setTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.themeVal === t));
        }
        const saved = localStorage.getItem('theme') || 'dark';
        setTheme(saved);

        // Tabs
        function showTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.style.display = 'block';
        }

        function getCookie(n) {
            const m = document.cookie.split(';').find(c => c.trim().startsWith(n + '='));
            return m ? m.trim().split('=')[1] : null;
        }
        if (getCookie('token')) window.location.href = '/dashboard';

        async function handleLogin(e) {
            e.preventDefault();
            try {
                const r = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        login: document.getElementById('loginLogin').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const d = await r.json();
                if (d.success) {
                    document.cookie = `token=${d.token};path=/;max-age=86400`;
                    document.cookie = `role=${d.user.role};path=/;max-age=86400`;
                    document.cookie = `userId=${d.user.id};path=/;max-age=86400`;
                    window.location.href = '/dashboard';
                } else {
                    showError(d.message || 'Ошибка входа');
                }
            } catch(e) { showError('Ошибка сети'); }
            return false;
        }

        async function handleRegister(e) {
            e.preventDefault();
            try {
                const r = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        login: document.getElementById('regLogin').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const d = await r.json();
                if (d.success) {
                    document.cookie = `token=${d.token};path=/;max-age=86400`;
                    document.cookie = `role=${d.user.role};path=/;max-age=86400`;
                    document.cookie = `userId=${d.user.id};path=/;max-age=86400`;
                    window.location.href = '/dashboard';
                } else {
                    showError(d.message || 'Ошибка регистрации');
                }
            } catch(e) { showError('Ошибка сети'); }
            return false;
        }
    </script>
</body>
</html>
