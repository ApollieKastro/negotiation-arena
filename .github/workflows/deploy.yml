name: Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_COMPOSE_FILE: docker-compose.yml

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-sha-tag: ${{ steps.meta.outputs.tags }}
      image-branch-tag: ${{ steps.meta.outputs.tags }}
      image-latest-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{branch}},enable={{!is_default_branch}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false
          provenance: true
          sbom: true

      - name: Output image digest
        run: |
          echo "Image pushed with tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to staging server
        id: deploy
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-branch-tag }}
          ENV_FILE_B64: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          set -euo pipefail
          
          echo "=== Deploying to Staging ==="
          echo "Host: $STAGING_HOST"
          echo "User: $STAGING_USER"
          echo "Image tag: $IMAGE_TAG"
          
          # Decode and write .env file
          echo "$ENV_FILE_B64" | base64 -d > /tmp/.env.staging
          
          # Create deployment script
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          
          IMAGE_TAG="$1"
          ENV_FILE="$2"
          COMPOSE_FILE="docker-compose.yml"
          
          echo "Pulling image: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"
          
          echo "Stopping existing container..."
          docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" down --remove-orphans || true
          
          echo "Starting new container..."
          IMAGE="$IMAGE_TAG" docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d
          
          echo "Waiting for health check..."
          for i in {1..30}; do
            if docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps --format json | jq -e '.Health == "healthy"' > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for health check... ($i/30)"
            sleep 2
          done
          
          echo "Health check failed!"
          docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=50
          exit 1
          DEPLOY_SCRIPT
          
          chmod +x /tmp/deploy.sh
          
          # Execute deployment on remote server
          scp /tmp/.env.staging "${STAGING_USER}@${STAGING_HOST}:/tmp/.env.staging"
          scp /tmp/deploy.sh "${STAGING_USER}@${STAGING_HOST}:/tmp/deploy.sh"
          scp docker-compose.yml "${STAGING_USER}@${STAGING_HOST}:docker-compose.yml"
          
          ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no "${STAGING_USER}@${STAGING_HOST}" \
            "IMAGE_TAG='$IMAGE_TAG' /tmp/deploy.sh '$IMAGE_TAG' '/tmp/.env.staging'"
          
          echo "=== Staging deployment successful ==="

      - name: Verify deployment
        if: success()
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          echo "=== Verifying staging deployment ==="
          ssh -o ConnectTimeout=10 "${STAGING_USER}@${STAGING_HOST}" \
            "curl -fsS http://localhost:3001/health && echo 'Health endpoint OK'"
          echo "=== Verification complete ==="

      - name: Rollback on failure
        if: failure()
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          ENV_FILE_B64: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          echo "=== Deployment failed, attempting rollback ==="
          
          cat > /tmp/rollback.sh << 'ROLLBACK_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          
          ENV_FILE="$1"
          COMPOSE_FILE="docker-compose.yml"
          
          echo "Rolling back to previous image..."
          docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" down --remove-orphans || true
          
          # Try to get previous image from docker images
          PREV_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v latest | head -1)
          if [ -n "$PREV_IMAGE" ]; then
            echo "Restoring previous image: $PREV_IMAGE"
            IMAGE="$PREV_IMAGE" docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d
            sleep 10
            if docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps --format json | jq -e '.Health == "healthy"' > /dev/null 2>&1; then
              echo "Rollback successful!"
              exit 0
            fi
          fi
          
          echo "Rollback failed - manual intervention required"
          exit 1
          ROLLBACK_SCRIPT
          
          chmod +x /tmp/rollback.sh
          
          echo "$ENV_FILE_B64" | base64 -d > /tmp/.env.staging
          scp /tmp/.env.staging "${STAGING_USER}@${STAGING_HOST}:/tmp/.env.staging"
          scp /tmp/rollback.sh "${STAGING_USER}@${STAGING_HOST}:/tmp/rollback.sh"
          
          ssh -o ConnectTimeout=30 "${STAGING_USER}@${STAGING_HOST}" \
            "/tmp/rollback.sh '/tmp/.env.staging'" || echo "Rollback script failed"

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.example.com
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production server
        id: deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-sha-tag }}
          ENV_FILE_B64: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -euo pipefail
          
          echo "=== Deploying to Production ==="
          echo "Host: $PROD_HOST"
          echo "User: $PROD_USER"
          echo "Image tag: $IMAGE_TAG"
          
          # Decode and write .env file
          echo "$ENV_FILE_B64" | base64 -d > /tmp/.env.prod
          
          # Create deployment script with zero-downtime strategy
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          
          IMAGE_TAG="$1"
          ENV_FILE="$2"
          COMPOSE_FILE="docker-compose.yml"
          
          echo "Pulling image: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"
          
          echo "Starting new container alongside old one..."
          # Start new container with different name for blue-green
          IMAGE="$IMAGE_TAG" docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --no-deps arena
          
          echo "Waiting for new container health check..."
          for i in {1..60}; do
            if docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps --format json | jq -e '.Health == "healthy"' > /dev/null 2>&1; then
              echo "New container healthy!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "New container health check timeout!"
              docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=100 arena
              exit 1
            fi
            echo "Waiting for health check... ($i/60)"
            sleep 2
          done
          
          echo "Stopping old container..."
          docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" down --remove-orphans || true
          
          echo "Restarting with new image as primary..."
          IMAGE="$IMAGE_TAG" docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d
          
          echo "Final health verification..."
          for i in {1..30}; do
            if docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps --format json | jq -e '.Health == "healthy"' > /dev/null 2>&1; then
              echo "Production deployment successful!"
              exit 0
            fi
            sleep 2
          done
          
          echo "Final health check failed!"
          exit 1
          DEPLOY_SCRIPT
          
          chmod +x /tmp/deploy.sh
          
          # Execute deployment on remote server
          scp /tmp/.env.prod "${PROD_USER}@${PROD_HOST}:/tmp/.env.prod"
          scp /tmp/deploy.sh "${PROD_USER}@${PROD_HOST}:/tmp/deploy.sh"
          scp docker-compose.yml "${PROD_USER}@${PROD_HOST}:docker-compose.yml"
          
          ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no "${PROD_USER}@${PROD_HOST}" \
            "IMAGE_TAG='$IMAGE_TAG' /tmp/deploy.sh '$IMAGE_TAG' '/tmp/.env.prod'"
          
          echo "=== Production deployment successful ==="

      - name: Verify production deployment
        if: success()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          echo "=== Verifying production deployment ==="
          ssh -o ConnectTimeout=10 "${PROD_USER}@${PROD_HOST}" \
            "curl -fsS http://localhost:3001/health && echo 'Health endpoint OK'"
          
          # Additional checks
          ssh -o ConnectTimeout=10 "${PROD_USER}@${PROD_HOST}" << 'EOF'
            echo "Container status:"
            docker ps --filter "name=negotiation-arena" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "Recent logs:"
            docker logs negotiation-arena --tail=20
          EOF
          echo "=== Verification complete ==="

      - name: Rollback on failure
        if: failure()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          ENV_FILE_B64: ${{ secrets.PROD_ENV_FILE }}
        run: |
          echo "=== Production deployment failed, attempting rollback ==="
          
          cat > /tmp/rollback.sh << 'ROLLBACK_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          
          ENV_FILE="$1"
          COMPOSE_FILE="docker-compose.yml"
          
          echo "Stopping failed container..."
          docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" down --remove-orphans || true
          
          # Get previous image (excluding latest and the failed one)
          PREV_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v latest | grep -v "$FAILED_TAG" | head -1)
          if [ -n "$PREV_IMAGE" ]; then
            echo "Restoring previous image: $PREV_IMAGE"
            IMAGE="$PREV_IMAGE" docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d
            sleep 15
            if docker-compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps --format json | jq -e '.Health == "healthy"' > /dev/null 2>&1; then
              echo "Production rollback successful!"
              exit 0
            fi
          fi
          
          echo "CRITICAL: Automatic rollback failed - manual intervention required immediately!"
          echo "Previous images available:"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.CreatedAt}}"
          exit 1
          ROLLBACK_SCRIPT
          
          chmod +x /tmp/rollback.sh
          
          echo "$ENV_FILE_B64" | base64 -d > /tmp/.env.prod
          scp /tmp/.env.prod "${PROD_USER}@${PROD_HOST}:/tmp/.env.prod"
          scp /tmp/rollback.sh "${PROD_USER}@${PROD_HOST}:/tmp/rollback.sh"
          
          # Pass the failed tag to rollback script
          FAILED_TAG="${{ needs.build-and-push.outputs.image-sha-tag }}"
          ssh -o ConnectTimeout=30 "${PROD_USER}@${PROD_HOST}" \
            "FAILED_TAG='$FAILED_TAG' /tmp/rollback.sh '/tmp/.env.prod'" || echo "Rollback script failed - ALERT ON-CALL"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deployment failed! Check workflow logs and server status immediately."
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  cleanup:
    name: Cleanup Old Images
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Cleanup GHCR old images
        uses: actions/ghcr-cleanup@v1
        with:
          token: ${{ secrets.GHCR_TOKEN || github.token }}
          repository: ${{ github.repository }}
          keep-min: 10
          keep-days: 30
          skip-tags: latest,main,dev
